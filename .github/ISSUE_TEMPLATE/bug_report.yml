name: Bug report
description: Something renders wrong, crashes, or the menu misbehaves.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much as you can — GPU and driver details matter a lot for a Vulkan shader loader.
        **Security problems:** please do not report them here; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select Lightshade Aurora, preset High
        2. Walk to a lake at sunset
        3. ...
    validations:
      required: true
  - type: dropdown
    id: pack
    attributes:
      label: Shader pack
      options:
        - Lightshade Daylight
        - Lightshade Aurora
        - A custom pack (link or attach it below)
        - Shaders off / not pack-related
    validations:
      required: true
  - type: input
    id: preset
    attributes:
      label: Preset and changed options
      placeholder: "High, Shadow detail 4096 px, Clouds Ultra"
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: "NVIDIA RTX 2080, driver 580.xx / AMD RX 7800 XT, Mesa 25.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 26.04 / Windows 11 / macOS 26"
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      value: |
        Lightshade: 0.0.1
        Minecraft: 26.3
        Fabric Loader:
        Fabric API:
        Sodium:
        Java:
        Other mods (or modpack name):
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant part of `logs/latest.log` (or a crash report). It will be formatted as code.
      render: text
